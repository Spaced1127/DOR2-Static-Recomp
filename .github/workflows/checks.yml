name: repository-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate RecompLauncher manifest
        run: |
          python -m pip install --quiet jsonschema
          python tools/validate_manifest.py docs/recomplauncher.schema.json docs/release/recomplauncher.json

      - name: Refuse game data in the repository
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Extension.ToLowerInvariant() -in @('.iso','.rvz','.gcm','.wbfs','.gcz','.dol','.elf','.rel','.gci','.sav','.raw','.mcd') -or
              $_.Name.ToLowerInvariant() -in @('main.dol','boot.bin','bi2.bin','apploader.img','fst.bin','opening.bnr','system.cfg') -or
              $_.FullName -match '[\\/](Game|files|extracted)[\\/]'
            } |
            Where-Object { $_.FullName -notmatch '[\\/]lib[\\/]' }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error file=$($_.FullName)::game data" }
            exit 1
          }
          Write-Host 'No game data found.'
